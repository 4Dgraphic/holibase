name: Deploy website

# Builds web/ and deploys it to Cloudflare (holibase.org) whenever it changes on main, and every
# morning, so the generated holiday pages (one per region, district and country) stay current.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (as for the API), DATABASE_URL (read-only
# use, to generate the pages). Without the Cloudflare secrets the job is skipped.

on:
  push:
    branches: [main]
    paths: ["web/**"]
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set, skipping deploy."
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -q "psycopg[binary]>=3.2" "babel>=2.16"
          if [ -n "$DATABASE_URL" ]; then python web/build.py --fetch; else echo "::warning::DATABASE_URL not set, building without generated pages"; python web/build.py; fi
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: npx --yes wrangler@4.149.0 deploy
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          for p in / /calendar/ /coverage/ /docs/ /docs/reference/ /licence/ /legal/ /privacy/ /school-holidays/ /public-holidays/ /public-holidays/de/ /llms.txt /assets/site.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://holibase.org$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' https://holibase.org/does-not-exist)
          echo "404 page: $code"; [ "$code" = 404 ]
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' https://www.holibase.org/docs/)
          echo "www redirect: $loc"; [ "$loc" = "https://holibase.org/docs/" ]

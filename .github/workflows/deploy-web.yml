name: Deploy website

# Builds web/ and deploys it to Cloudflare (holibase.org) whenever it changes on main.
# Uses the same repository secrets as the API: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them the job is skipped, so nothing breaks.

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set, skipping deploy."
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python web/build.py
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: npx --yes wrangler@4.149.0 deploy
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          for p in / /calendar/ /coverage/ /docs/ /docs/reference/ /licence/ /legal/ /privacy/ /assets/site.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://holibase.org$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' https://holibase.org/does-not-exist)
          echo "404 page: $code"; [ "$code" = 404 ]
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' https://www.holibase.org/docs/)
          echo "www redirect: $loc"; [ "$loc" = "https://holibase.org/docs/" ]

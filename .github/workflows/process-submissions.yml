name: Process submissions

# Every night: checks the school calendars sent with the form on holibase.org against their linked
# documents (scripts/process_submissions.py) and publishes the ones that match. Runs before the
# website is rebuilt (deploy-web, 03:17 UTC), so an accepted calendar is on the site the same morning.

on:
  schedule:
    - cron: "41 2 * * *"        # daily, 02:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check and report, roll back)"
        type: boolean
        default: false

concurrency:
  group: database-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Process
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python scripts/process_submissions.py "${args[@]}"

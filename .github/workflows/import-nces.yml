name: Import US school districts (NCES)

# Loads the US school district directory from NCES (public domain) into education_authorities:
# ~19,000 agencies with NCES id, city, county, coordinates, type and student count.
# NCES publishes a new school year once a year; the monthly run picks it up by itself and
# only writes rows that changed. Existing editorial districts keep their id, name and calendars.

on:
  schedule:
    - cron: "41 5 3 * *"        # 3rd of every month, 05:41 UTC
  push:
    branches: [main]
    paths:
      - "data/nces/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (import and report, then roll back)"
        type: boolean
        default: true

concurrency:
  group: database-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python scripts/import_nces.py "${args[@]}"

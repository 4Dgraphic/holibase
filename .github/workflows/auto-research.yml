name: Automatic research

# Once a month (28th, so the data report on the 1st shows the result): looks for the school calendars the data report lists as missing, reads the official
# documents with a language model (OpenAI or Anthropic, whichever key is set), checks the dates and
# imports them. The result is committed as data/editorial/auto-<date>.json, so every change is in the
# history and can be reverted. Confirmed calendars go live at once; doubtful ones stay pending.
# A summary is added as a comment to the open data report issue.

on:
  schedule:
    - cron: "37 4 28 * *"       # 28th of the month, 04:37 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Only these countries (e.g. ES,IT); empty = all with gaps"
        required: false
      max_calls:
        description: "Documents the model may read in this run"
        default: "80"
      dry_run:
        description: "Dry run (research and report, import rolled back, nothing committed)"
        type: boolean
        default: false

concurrency:
  group: database-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Research
        id: research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "Set the OPENAI_API_KEY (or ANTHROPIC_API_KEY) secret to enable automatic research." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--report research.md --max-calls "${{ inputs.max_calls || '80' }}")
          if [ -n "${{ inputs.countries }}" ]; then args+=(--countries "${{ inputs.countries }}"); fi
          python scripts/auto_research.py "${args[@]}"
      # Committed before the import, so a failed import never loses a long research run:
      # the file can then be imported with the "Import editorial calendars" workflow.
      - name: Commit
        if: steps.research.outputs.file != '' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.research.outputs.file }}" data/research/sources.json
          git commit -m "Automatic research $(date -u +%F)"
          git pull --rebase
          git push
      - name: Import
        if: steps.research.outputs.file != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python scripts/import_editorial.py "${args[@]}" "${{ steps.research.outputs.file }}"
      - name: Comment on the data report
        if: steps.research.outputs.file != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label data-report --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file research.md; fi

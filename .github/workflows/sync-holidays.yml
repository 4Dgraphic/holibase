name: Sync library holidays

# Recomputes public holidays and library school calendars with the newest python-holidays
# release and syncs them into the database (insert / update / delete inside the window).
# Runs weekly; exits early when neither the library version nor the year window changed.

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compute and report, then roll back)"
        type: boolean
        default: true
      force:
        description: "Run even if version and window are unchanged"
        type: boolean
        default: false
      countries:
        description: "Only these countries, comma separated (e.g. DE,US). Empty = all"
        type: string
        default: ""

concurrency:
  group: sync-holidays
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install newest python-holidays
        run: |
          pip install --upgrade -r scripts/requirements.txt
          python -c "import holidays; print('python-holidays', holidays.__version__)"

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            [ "${{ inputs.force }}" = "true" ] && args+=(--force)
            [ -n "${{ inputs.countries }}" ] && args+=(--countries "${{ inputs.countries }}")
          fi
          python scripts/sync.py "${args[@]}"
